name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # OpenClaw installs plugins from git without running build scripts, so
      # the compiled dist/ is committed and must match the sources. The build
      # starts from an empty dist/, so stale files from deleted sources show up.
      - run: npm run build
      - name: dist/ is up to date
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --porcelain -- dist
            echo "dist/ is out of date: run npm run build and commit it." >&2
            exit 1
          fi
      # npm and ClawHub install the packed tarball, not the checkout, so check
      # the tarball the way ClawHub does before it publishes a release.
      - name: Package passes ClawHub validation
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/pack"
          tar -xzf "$RUNNER_TEMP"/pack/*.tgz -C "$RUNNER_TEMP/pack"
          npx --yes clawhub@0.25.1 package validate "$RUNNER_TEMP/pack/package"
